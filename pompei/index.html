<script>
/* =====================================================================
   1. Easing & helpers — personnalité « Premium » (skill motion-design)
   ===================================================================== */
function bezier(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const e=sx(t)-x;if(Math.abs(e)<1e-6)break;const d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d;}return sy(t);};}
const E={premium:bezier(.4,0,.2,1),enter:bezier(.05,.7,.1,1),exit:bezier(.3,0,1,1),sine:x=>-(Math.cos(Math.PI*x)-1)/2,expo:x=>x>=1?1:1-Math.pow(2,-10*x),lin:x=>x,
  back:x=>{const c1=1.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}};
/* Identité de mouvement — skill › motion-personality › « Brand Motion Identity » (Premium)
   signature (.4,0,.2,1) · palette 350/500/800 ms · entrée = montée 15-25px + fondu · sorties = 65-75 % de l'entrée */
const M={quick:.35,std:.5,slow:.8,rise:20,exitRatio:.7};
const REDUCED=new URLSearchParams(location.search).has('reduced'); // skill › context-adaptation › prefers-reduced-motion
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,k)=>a+(b-a)*k;
const P=(t,t0,d,e=E.premium)=>e(clamp((t-t0)/d));
const rnd=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(rnd(i),rnd(i+1),u);}
const $=s=>document.querySelector(s);
function camKF(t,keys,ease=E.premium){if(REDUCED)return {...keys[0][1]};const v=kf(t,keys,ease);
  for(let i=0;i<keys.length-1;i++){const [a,va]=keys[i],[b,vb]=keys[i+1];if(t>=a&&t<b){const dx=vb.x-va.x,dy=vb.y-va.y,L=Math.hypot(dx,dy);
    if(L>20){const k=Math.sin(Math.PI*ease(clamp((t-a)/(b-a))));v.x+=-dy/L*15/v.z*k;v.y+=dx/L*15/v.z*k;}break;}}return v;}
const css=(el,o)=>{for(const k in o)el.style[k]=o[k];};
const tf=(x=0,y=0,s=1,r=0)=>`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
/** keyframes: [[t,{...}],...] with numeric props */
function kf(t,keys,ease=E.premium){if(t<=keys[0][0])return {...keys[0][1]};
  for(let i=0;i<keys.length-1;i++){const [a,va]=keys[i],[b,vb]=keys[i+1];if(t<b){const k=ease(clamp((t-a)/(b-a)));const o={};for(const p in va)o[p]=lerp(va[p],vb[p]??va[p],k);return o;}}
  return {...keys[keys.length-1][1]};}

let TIMING;const DUR=69.0;
function wt(word,n=1){let c=0;for(const w of TIMING.words){if(w.w.replace(/[.,:;?…\s ]/g,'').toLowerCase()===word.toLowerCase()){if(++c===n)return w.t;}}throw new Error('word '+word);}
const st=i=>TIMING.sentences[i].t;

/* =====================================================================
   2. Palette
   ===================================================================== */
const C={ink:'#15110d',skin:'#EDB894',skinS:'#D49A78',blush:'#E8857A',
  khaki:'#8E7F4E',khakiD:'#6A5D36',khakiL:'#A8975F',grey:'#6F7A6C',greyD:'#515B4F',greyL:'#87927F',
  leather:'#4A3524',boot:'#2B211A',black:'#1E1D1B',brass:'#C9A24A',
  snow:'#E6ECF4',snowS:'#B8C4D8',earth:'#3A2B21',earthD:'#2A1F18',earthL:'#4B382A',wood:'#6B4A2F',woodD:'#4A3322',
  nightT:'#060A17',nightB:'#1C2948',gold:'#F2C46B',red:'#E0533F',cream:'#FFF6E6'};

/* =====================================================================
   3. Personnage : soldat articulé (rig 2D)
   repère local : pieds en (0,0), regard vers +x, hauteur ≈ 300
   ===================================================================== */
const POSE={
  idle:  {ba:.12,bb:.25,fa:.08,fb:.3, rifle:0},
  aim:   {ba:.72,bb:1.45,fa:1.5,fb:.05, rifle:1},
  lower: {ba:.25,bb:.95,fa:.55,fb:.35, rifle:1},
  shake: {ba:.12,bb:.25,fa:1.12,fb:.32, rifle:0},
  up:    {ba:2.75,bb:.2,fa:2.85,fb:.2, rifle:0},
  climb: {ba:2.1,bb:.5,fa:2.3,fb:.4, rifle:0},
  sing:  {ba:.55,bb:1.6,fa:.6,fb:1.55, rifle:0, book:1},
  bow:   {ba:.3,bb:1.25,fa:.35,fb:1.2, rifle:0},
  offer: {ba:.12,bb:.25,fa:1.3,fb:.15, rifle:0},
};
const OUTFITS={
  fr:{coat:'#4F6A8F',coatD:'#3C5273',coatL:'#6B86AA',trouser:'#B2342B',leg:'shoe',hat:'kepi'},
  archduke:{coat:'#A9C3D9',coatD:'#86A2BA',coatL:'#C4D7E6',trouser:'#1E1D1B',leg:'boot',hat:'plume',medals:1},
  princip:{coat:'#3A3530',coatD:'#2A2622',coatL:'#4D4740',trouser:'#2A2622',leg:'shoe',hat:'none',noMous:1,collar:1},
  civA:{coat:'#5B4636',coatD:'#46362A',coatL:'#6E5745',trouser:'#3A2F27',leg:'shoe',hat:'fedora'},
  civB:{coat:'#3F4A55',coatD:'#313A43',coatL:'#55616D',trouser:'#2B3138',leg:'shoe',hat:'fedora'},
  civC:{coat:'#6B5B3E',coatD:'#54472F',coatL:'#7E6C4C',trouser:'#3A2F27',leg:'shoe',hat:'none',noMous:1},
  driver:{coat:'#2E2E30',coatD:'#202022',coatL:'#3D3D40',trouser:'#202022',leg:'boot',hat:'fedora'},
  romanA:{coat:'#C98A3E',coatD:'#A66E2C',coatL:'#DDA25A',trouser:'#EDB894',leg:'sandal',hat:'none',belt:1,noMous:1},
  romanB:{coat:'#A8403A',coatD:'#86302B',coatL:'#C25A52',trouser:'#E3AA86',leg:'sandal',hat:'none',belt:1},
  romanW:{coat:'#3E6A8A',coatD:'#2F5470',coatL:'#5585A6',trouser:'#3E6A8A',leg:'sandal',hat:'veil',noMous:1},
  vendor:{coat:'#E3D5B8',coatD:'#C9B99A',coatL:'#F0E6D0',trouser:'#E3AA86',leg:'sandal',hat:'none',belt:1},
  arch:{coat:'#B9A57A',coatD:'#9A8760',coatL:'#CDBB92',trouser:'#5A4A3A',leg:'boot',hat:'fedora',noMous:1},
  worker18:{coat:'#6B4A2F',coatD:'#543A24',coatL:'#7F5A3B',trouser:'#4A3A2A',leg:'shoe',hat:'tricorne',belt:1},
  fiorelli:{coat:'#2E2A27',coatD:'#221F1C',coatL:'#3D3833',trouser:'#221F1C',leg:'shoe',hat:'none',beard:1,collar:1},
};
function mixPose(a,b,k){const o={};for(const p in a)o[p]=lerp(a[p],b[p]??a[p],k);return o;}
/* Follow-through / overlapping action (disney-principles §5) : le bras arrière suit le bras avant avec 100 ms de retard */
function poseT(a,b,t,t0,d,e=E.premium){const kf_=P(t,t0,d,e),kb=P(t,t0+.1,d,e);const o=mixPose(a,b,kf_);o.ba=lerp(a.ba,b.ba,kb);o.bb=lerp(a.bb,b.bb,kb);o.rifle=kf_<.5?a.rifle:b.rifle;o.book=kf_<.5?a.book:b.book;return o;}
/* Anticipation (disney §2) : petit recul (10-20 %) 150 ms avant la marche, légère inclinaison pendant, retour posé à l'arrêt */
function lean(t,w0,w1){if(t<w0-.15||t>w1+.35)return 0;if(t<w0)return -.06*Math.sin(Math.PI*clamp((t-w0+.15)/.15));if(t<w1)return .035*P(t,w0,.25);return .035*(1-P(t,w1,.35));}
function limb(c,x,y,a,b,L1,L2,w,col){const ex=x+Math.sin(a)*L1,ey=y+Math.cos(a)*L1,a2=a+b,hx=ex+Math.sin(a2)*L2,hy=ey+Math.cos(a2)*L2;
  c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(x,y);c.lineTo(ex,ey);c.lineTo(hx,hy);c.stroke();return {ex,ey,hx,hy};}
function drawArm(c,sx,sy,a,b,col,colD){const r=limb(c,sx,sy,a,b,58,52,25,col);
  c.strokeStyle=colD;c.lineWidth=25;c.beginPath();c.moveTo(lerp(r.ex,r.hx,.74),lerp(r.ey,r.hy,.74));c.lineTo(lerp(r.ex,r.hx,.82),lerp(r.ey,r.hy,.82));c.stroke();
  c.fillStyle=C.skin;c.beginPath();c.arc(r.hx,r.hy,11.5,0,7);c.fill();return r;}
function drawLeg(c,hx,hy,a,knee,style,trouser){const brit=style==='puttee';const kx=hx+Math.sin(a)*60,ky=hy+Math.cos(a)*60,a2=a-knee,fx=kx+Math.sin(a2)*58,fy=ky+Math.cos(a2)*58;
  c.lineCap='round';c.lineJoin='round';c.strokeStyle=trouser;c.lineWidth=27;c.beginPath();c.moveTo(hx,hy);c.lineTo(kx,ky);c.lineTo(fx,fy);c.stroke();
  if(brit){c.strokeStyle='#5C5034';c.lineWidth=24;c.beginPath();c.moveTo(lerp(kx,fx,.35),lerp(ky,fy,.35));c.lineTo(fx,fy);c.stroke();
    c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=2;for(let i=1;i<5;i++){const k=.35+i*.13;c.beginPath();c.moveTo(lerp(kx,fx,k)-12,lerp(ky,fy,k)+3);c.lineTo(lerp(kx,fx,k)+12,lerp(ky,fy,k)-3);c.stroke();}
    c.fillStyle=C.leather;}
  else if(style==='shoe'){c.fillStyle='#1E1A17';}
  else if(style==='sandal'){c.fillStyle='#6B4A2F';}
  else{c.strokeStyle=C.black;c.lineWidth=29;c.beginPath();c.moveTo(lerp(kx,fx,.2),lerp(ky,fy,.2));c.lineTo(fx,fy);c.stroke();c.fillStyle=C.black;}
  c.beginPath();c.ellipse(fx+9,fy+2,21,10,0,0,7);c.fill();}
function drawRifle(c,x1,y1,x2,y2,len=215){const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  const sx=x1-ux*42,sy=y1-uy*42;c.lineCap='round';
  c.strokeStyle=C.wood;c.lineWidth=15;c.beginPath();c.moveTo(sx,sy);c.lineTo(sx+ux*120,sy+uy*120);c.stroke();
  c.strokeStyle='#2d2d2f';c.lineWidth=6;c.beginPath();c.moveTo(sx+ux*60,sy+uy*60);c.lineTo(sx+ux*len,sy+uy*len);c.stroke();
  c.strokeStyle=C.woodD;c.lineWidth=5;c.beginPath();c.moveTo(sx+ux*8,sy+uy*8+6);c.lineTo(sx+ux*40,sy+uy*40+4);c.stroke();
  return {mx:sx+ux*len,my:sy+uy*len,ux,uy};}
function drawHead(c,o,brit){
  c.fillStyle=C.skinS;c.fillRect(-8,-8,18,16);
  c.fillStyle=C.skin;c.beginPath();c.arc(6,-30,31,0,7);c.fill();
  c.fillStyle=C.skinS;c.beginPath();c.arc(-9,-28,7,0,7);c.fill();
  c.fillStyle=C.blush;c.globalAlpha=.35;c.beginPath();c.arc(20,-18,7,0,7);c.fill();c.globalAlpha=1;
  // nez
  c.fillStyle=C.skinS;c.beginPath();c.moveTo(33,-34);c.quadraticCurveTo(44,-22,32,-19);c.closePath();c.fill();
  // œil + sourcil
  const blink=o.blink;c.fillStyle=C.ink;c.strokeStyle=C.ink;c.lineCap='round';
  if(blink||o.eyesClosed){c.lineWidth=3;c.beginPath();c.moveTo(14,-33);c.quadraticCurveTo(19,-30,24,-33);c.stroke();}
  else{c.beginPath();c.ellipse(19+(o.look||0)*2,-34,3.6,4.4,0,0,7);c.fill();}
  c.lineWidth=3.6;c.beginPath();c.moveTo(12,-44+(o.worry||0)*3);c.lineTo(25,-45-(o.worry||0)*2);c.stroke();
  // bouche
  const m=o.mouth||0;
  if(m>.05){c.fillStyle='#5B2A22';c.beginPath();c.ellipse(25,-8,5+m*2,2+m*6,0,0,7);c.fill();}
  else{c.lineWidth=3;c.beginPath();c.moveTo(20,-9);c.quadraticCurveTo(25,-8+(o.smile||0)*-4+2,30,-10);c.stroke();}
  // moustache
  if(o.beard){c.fillStyle='#4A3F36';c.beginPath();c.ellipse(16,-6,24,18,.15,0,7);c.fill();}
  if(!o.noMous){c.fillStyle=brit?'#6B4A2F':'#4A3424';c.beginPath();c.ellipse(30,-16,brit?7:11,brit?2.6:4.2,-.1,0,7);c.fill();}
  // coiffe
  if(o.hat!==false&&o.hatType){const h=o.hatType;
    if(h==='kepi'){c.fillStyle='#B2342B';c.beginPath();c.moveTo(-26,-48);c.lineTo(-20,-80);c.lineTo(32,-84);c.lineTo(34,-48);c.closePath();c.fill();
      c.fillStyle='#2E4166';c.fillRect(-28,-56,64,12);c.fillStyle='#1E1A17';c.beginPath();c.moveTo(26,-46);c.quadraticCurveTo(46,-46,52,-38);c.lineTo(28,-40);c.closePath();c.fill();}
    else if(h==='plume'){c.fillStyle='#22302A';c.beginPath();c.moveTo(-30,-44);c.bezierCurveTo(-34,-80,40,-82,38,-46);c.closePath();c.fill();c.fillStyle=C.brass;c.fillRect(-28,-50,66,6);
      c.fillStyle='#3E8E4A';for(let i=0;i<6;i++){c.save();c.translate(2,-74);c.rotate(-.9+i*.32);c.beginPath();c.ellipse(0,-22,7,24,0,0,7);c.fill();c.restore();}}
    else if(h==='fedora'){c.fillStyle='#2B2420';c.beginPath();c.ellipse(4,-50,44,9,0,0,7);c.fill();c.beginPath();c.moveTo(-24,-50);c.bezierCurveTo(-26,-84,34,-86,32,-50);c.closePath();c.fill();
      c.fillStyle='#5B4636';c.fillRect(-25,-60,58,7);}
    else if(h==='veil'){c.fillStyle='#D9C7A0';c.beginPath();c.moveTo(-34,8);c.bezierCurveTo(-46,-70,30,-84,40,-46);c.lineTo(30,-40);c.bezierCurveTo(22,-66,-22,-60,-20,-20);c.lineTo(-18,10);c.closePath();c.fill();}
    else if(h==='tricorne'){c.fillStyle='#1E1A17';c.beginPath();c.moveTo(-44,-48);c.quadraticCurveTo(4,-30,52,-48);c.lineTo(36,-72);c.quadraticCurveTo(4,-92,-30,-72);c.closePath();c.fill();}
    else if(h==='none'){c.fillStyle='#2A2018';c.beginPath();c.moveTo(-26,-26);c.bezierCurveTo(-36,-70,32,-80,36,-46);c.quadraticCurveTo(10,-58,-10,-46);c.quadraticCurveTo(-18,-40,-20,-22);c.closePath();c.fill();}
  }
  else if(o.hat!==false){
    if(brit){c.fillStyle=C.khaki;c.beginPath();c.moveTo(-28,-46);c.bezierCurveTo(-34,-76,40,-80,38,-48);c.closePath();c.fill();
      c.fillStyle=C.khakiD;c.fillRect(-27,-50,63,10);
      c.fillStyle='#3A2C1C';c.beginPath();c.moveTo(26,-44);c.quadraticCurveTo(46,-44,54,-36);c.lineTo(28,-38);c.closePath();c.fill();
      c.fillStyle=C.brass;c.beginPath();c.arc(30,-58,4,0,7);c.fill();}
    else{c.fillStyle='#454A42';c.beginPath();c.moveTo(-30,-38);c.bezierCurveTo(-36,-82,42,-84,38,-40);c.closePath();c.fill();
      c.beginPath();c.moveTo(30,-42);c.lineTo(52,-34);c.lineTo(30,-34);c.closePath();c.fill();
      c.beginPath();c.moveTo(-28,-40);c.lineTo(-42,-30);c.lineTo(-26,-32);c.closePath();c.fill();
      c.fillStyle='#8E8C78';c.fillRect(1,-80,10,7);c.beginPath();c.moveTo(1,-80);c.lineTo(11,-80);c.lineTo(6,-102);c.closePath();c.fill();
      c.fillStyle=C.brass;c.globalAlpha=.8;c.beginPath();c.arc(22,-56,5,0,7);c.fill();c.globalAlpha=1;}
  }
}
/**
 * soldier(c,{x,y,s,f(+1 droite/-1 gauche),side:'brit'|'ger',t,pose:{…},walk,walkAmp,tilt,bow,mouth,look,smile,worry,alpha,squash})
 */
function soldier(c,o){

  const p=o.pose||POSE.idle,t=o.t||0,ph=o.walk||0,wa=o.walkAmp||0,seed=o.seed||0;
  c.save();c.translate(o.x,o.y);c.scale((o.s||1)*(o.f||1)*(o.squash||1),o.s||1);c.globalAlpha=o.alpha??1;
  const breath=Math.sin(t*1.8+seed)*1.6,bob=-Math.abs(Math.cos(ph))*7*wa;  // respiration ≈3,5 s (ambient-continuous › breathing)
  // ombre au sol : quand le corps se soulève, l'ombre s'étale et pâlit (choreography › counter-motion « Lifts »)
  if(o.shadow!==false){const lift=-bob;c.fillStyle=`rgba(0,0,0,${.32-lift*.012})`;c.beginPath();c.ellipse(4,3,48*(1+lift*.025),9,0,0,7);c.fill();}
  c.rotate(o.lean||0);
  const hs=Math.sin(ph-.9)*wa*6;   // pan de capote : suit les jambes avec retard (follow-through)
  // jambes
  const la=Math.sin(ph)*.48*wa,kn=(.12+.5*Math.max(0,-Math.cos(ph)))*wa,kn2=(.12+.5*Math.max(0,Math.cos(ph)))*wa;
  drawLeg(c,-6,-118+bob,-la,kn2,legS,trD);
  c.translate(0,bob);
  // bras arrière
  const swing=Math.sin(ph)*.38*wa;
  const ba=drawArm(c,-2,-222+breath,p.ba-swing,p.bb,coatD,'#00000033');
  // fusil dans le dos
  if(!p.rifle&&o.rifleBack!==false){c.save();c.translate(-22,-130);c.rotate(-.42+Math.sin(ph*2-1.2)*.06*wa);c.strokeStyle=C.wood;c.lineWidth=13;c.lineCap='round';c.beginPath();c.moveTo(0,40);c.lineTo(0,-60);c.stroke();
    c.strokeStyle='#2d2d2f';c.lineWidth=6;c.beginPath();c.moveTo(0,-40);c.lineTo(0,-150);c.stroke();c.restore();}
  drawLeg(c,6,-118,la,kn,legS,trF);
  // torse (capote)
  c.fillStyle=coat;c.beginPath();c.moveTo(-34,-232+breath);c.quadraticCurveTo(2,-246+breath,38,-232+breath);c.lineTo(50+hs,-94);c.quadraticCurveTo(2+hs,-84,-46+hs,-94);c.closePath();c.fill();
  c.fillStyle=coatD;c.globalAlpha*=.55;c.beginPath();c.moveTo(-34,-232+breath);c.lineTo(-46,-94);c.quadraticCurveTo(-30,-90,-18,-90);c.lineTo(-14,-228+breath);c.closePath();c.fill();c.globalAlpha=o.alpha??1;
  c.fillStyle=coatL;c.globalAlpha*=.35;c.fillRect(30,-226+breath,6,128);c.globalAlpha=o.alpha??1;
  c.fillStyle=brit?'#7A6A40':C.black;if(!OF||OF.hat==='kepi'||OF.medals)c.fillRect(-42,-156,92,12);
  if(OF&&OF.belt){c.fillStyle='#5A3A22';c.fillRect(-44,-154,96,8);}
  c.fillStyle=brit?C.leather:'#3a3a36';c.fillRect(14,-160,16,20);
  c.fillStyle=brit?C.brass:'#B9B6A2';for(let i=0;i<4;i++){c.beginPath();c.arc(24,-214+i*22+breath*.5,3.3,0,7);c.fill();}
  if(OF){if(OF.medals){c.fillStyle=C.brass;c.fillRect(-30,-236+breath,64,7);for(const [x,col] of [[-14,'#C8463B'],[-4,'#E8D9A8'],[6,'#3E8E4A']]){c.fillStyle=col;c.fillRect(x,-206+breath,8,12);}}
    if(OF.collar){c.fillStyle='#EDE6DA';c.beginPath();c.moveTo(4,-238+breath);c.lineTo(24,-238+breath);c.lineTo(14,-212+breath);c.closePath();c.fill();}}
  else if(brit){c.strokeStyle='#76663E';c.lineWidth=7;c.beginPath();c.moveTo(-26,-228+breath);c.lineTo(34,-150);c.stroke();}
  else{c.fillStyle='#B4423A';c.fillRect(14,-238+breath,16,7);}
  // tête
  c.save();c.translate(4,-236+breath);c.rotate((o.tilt||0)+(o.bow||0)+Math.sin(ph*2-1.0)*.03*wa); // tête : overlapping action
  drawHead(c,{blink:((t+seed*1.7)%3.9)<.12,mouth:o.mouth,look:o.look,smile:o.smile,worry:o.worry,eyesClosed:o.eyesClosed,hat:o.hat,hatType:OF?OF.hat:null,noMous:OF&&OF.noMous,beard:OF&&OF.beard},brit);c.restore();
  // fusil en main + bras avant

}

/* =====================================================================

const G=1000,FLOOR=1200,TB=[240,460],TG=[1540,1760];
const STARS=[...Array(170)].map((_,i)=>({x:-700+rnd(i)*3400,y:-2200+rnd(i+500)*3000,r:.8+rnd(i+900)*2.2,p:rnd(i+77)*6}));
function surfaceY(x){return G+Math.sin(x*.011)*4+Math.sin(x*.031+1)*3;}
function drawSky(c,o){
  const g=c.createLinearGradient(0,-2200,0,G);g.addColorStop(0,o.top||C.nightT);g.addColorStop(1,o.bot||C.nightB);c.fillStyle=g;c.fillRect(-1500,-2600,5000,G+2600);
  c.save();c.translate((CURV.x-1000)*.8,(CURV.y-850)*.8); // arrière-plan à 0,2x
  STARS.forEach((s,i)=>{if(s.y>G-120)return;let a=.5;if(i%14===0){const k=((o.t+s.p*2)%2.6)/1.0;a=k<1?.3+.7*Math.sin(k*Math.PI):.3;}
    c.globalAlpha=a*(o.stars??1);c.fillStyle='#fff';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill();});
  c.globalAlpha=1;
  // lune
  const mx=o.moonX??1720,my=o.moonY??260;const mg=c.createRadialGradient(mx,my,40,mx,my,260);mg.addColorStop(0,'rgba(230,236,255,.28)');mg.addColorStop(1,'rgba(230,236,255,0)');
  c.fillStyle=mg;c.fillRect(mx-260,my-260,520,520);c.fillStyle='#EEF1F7';c.beginPath();c.arc(mx,my,58,0,7);c.fill();
  c.fillStyle='#D3D9E6';for(const [dx,dy,r] of [[-18,-12,11],[16,10,8],[6,-26,6],[-8,22,7]]){c.beginPath();c.arc(mx+dx,my+dy,r,0,7);c.fill();}
  c.restore();
  c.save();c.translate((CURV.x-1000)*.5,0); // plan intermédiaire à 0,5x
  // collines lointaines
  c.fillStyle='#121A30';c.beginPath();c.moveTo(-1500,G);for(let x=-1500;x<=3500;x+=60)c.lineTo(x,G-70-Math.sin(x*.004)*40-Math.sin(x*.013)*18);c.lineTo(3500,G);c.closePath();c.fill();
  c.fillStyle='#18223B';c.beginPath();c.moveTo(-1500,G);for(let x=-1500;x<=3500;x+=50)c.lineTo(x,G-30-Math.sin(x*.007+2)*18);c.lineTo(3500,G);c.closePath();c.fill();

function deadTree(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle='#0F1424';c.lineCap='round';c.lineWidth=16;
  c.beginPath();c.moveTo(0,0);c.lineTo(4,-170);c.stroke();c.lineWidth=8;c.beginPath();c.moveTo(2,-90);c.lineTo(-40,-140);c.moveTo(4,-130);c.lineTo(38,-170);c.moveTo(4,-160);c.lineTo(-14,-205);c.stroke();c.restore();}

function sandbags(c,x1,x2,y,col){const n=Math.round((x2-x1)/44);for(let r=0;r<2;r++)for(let i=0;i<n-r;i++){const x=x1+22+i*44+r*22,yy=y-14-r*24;

function tin(c,x,y,s,r=0){c.save();c.translate(x,y);c.rotate(r);c.scale(s,s);c.fillStyle='#9AA3A8';c.beginPath();c.roundRect(-55,-70,110,100,8);c.fill();

/* beat() : découpe une animation en 4 actes selon « Scaling to Duration »
   400-800 ms → 15-20 / 30-40 / 15-20 / 20-25 %   ·   ≥ 800 ms → 20 / 30-35 / 15-20 / 25-30 % */
function beat(t,t0,d){const r=d>=.8?[.2,.33,.17,.3]:[.18,.37,.2,.25];
  const a1=t0+d*r[0],x1=a1+d*r[1],r1=x1+d*r[2];
  return {a:P(t,t0,d*r[0],E.premium),x:P(t,a1,d*r[1],E.enter),r:P(t,x1-d*.05,d*r[2]+d*.05,E.enter),s:P(t,r1,t0+d-r1,E.sine),on:t>=t0,end:t0+d};}
/* Motifs « Common Patterns » */
function reveal(t,t0,d){const b=beat(t,t0,d);   // tension (assombri, 95 %) → apparition (100 %) → l'entourage s'ajuste → posé
  return {alpha:b.x>0?lerp(.35,1,b.x):.35*b.a,scale:lerp(.95,1,b.x),dim:b.a*(1-b.s)*.5,react:b.r,settle:b.s,b};}
function departure(t,t0,d){const b=beat(t,t0,d);   // rassemblement (98 %) → sortie → l'espace se referme → posé
  return {scale:lerp(1,.98,b.a),out:P(t,t0+d*.2,d*.37,E.exit),close:b.r,settle:b.s,b};}
function transformation(t,t0,d){const b=beat(t,t0,d);   // déstabilisation (vibration) → métamorphose → secondaire → nouvel état qui respire
  return {shake:Math.sin(t*60)*4*b.a*(1-b.x),morph:b.x,secondary:b.r,breathe:b.s>0?Math.sin((t-b.end)*2.5)*.015*b.s:0,b};}
function impact(t,t0,d){const k=P(t,t0,d*.2,E.expo);   // action soudaine → onde → stabilisation lente
  return {hit:k,ripple:P(t,t0+d*.1,d*.4,E.enter),settle:P(t,t0+d*.45,d*.55,E.sine)};}

    c.fillStyle='#4A5566';for(const [x,w,h] of [[60,120,420],[200,90,300],[310,140,520],[470,110,360],[600,150,600],[770,100,330],[890,140,470]]){c.fillRect(x,900-h,w,h);c.fillStyle='#F2C46B';for(let r=0;r<h/60-1;r++)for(let q=0;q<w/40-1;q++)if(rnd(x+r*7+q)>.5)c.fillRect(x+14+q*36,900-h+20+r*60,14,22);c.fillStyle='#4A5566';}
    // recouverte de cendre (comme Pompéi)
    const k=P(t,wt('retrouvée'),1.4,E.premium);strata(c,900-560*k,1500,k,t);c.fillStyle='#4A3A2A';c.fillRect(0,1500,1080,420);
    // objets modernes dans la coupe : cascade 100 ms × 3
    const ob=[(x,y)=>phone(c,x,y,1,.3),(x,y)=>sneaker(c,x,y,1,-.2),(x,y)=>can(c,x,y,1,.5)];const ps=[[250,1250],[560,1330],[860,1200]];
    ob.forEach((f,i)=>{const kk=P(t,wt('Quel')+i*.1,M.std,E.enter);if(kk<=0)return;c.save();c.globalAlpha=kk;c.translate(0,M.rise*(1-kk));f(...ps[i]);c.restore();});
    txt(c,'Dans 2 000 ans…',540,430,{a:P(t,wt('deux'),M.std,E.enter),font:'italic 700 72px Cormorant',col:'#2A211A'});
    txt(c,'?',540,1060,{a:P(t,wt('époque'),M.slow,E.enter),font:'700 220px Cormorant',col:C.gold});
    const ca=wt('époque')+.6,cc=P(t,ca,M.std,E.enter);label(c,540,1780,'QUEL OBJET ? RÉPONDS EN COMMENTAIRE',{a:cc*(1-P(t,DUR-.5,.5)),size:22});
    return {dust:.2};
  });
}
function crownSmall(c,x,y,a){c.save();c.globalAlpha=a;c.translate(x,y);c.fillStyle=C.gold;c.beginPath();c.moveTo(-40,20);c.lineTo(-40,-18);c.lineTo(-20,0);c.lineTo(0,-28);c.lineTo(20,0);c.lineTo(40,-18);c.lineTo(40,20);c.closePath();c.fill();c.restore();}

/* =====================================================================
   10. Sous-titres, DOM, mode annoté
   ===================================================================== */
let CH=[];
function buildCaps(){const box=$('#caps');TIMING.chunks.forEach((c,ci)=>{const d=document.createElement('div');d.className='chunk';const ws=TIMING.words.filter(w=>w.chunk===ci);
  d.innerHTML=ws.map(w=>`<span class="w">${w.w}</span>`).join('');box.appendChild(d);CH.push({el:d,c,ws,sp:[...d.querySelectorAll('.w')]});});}
let NOCAP;
function renderCaps(t){const hid=NOCAP.some(([a,b])=>t>=a&&t<b);
  for(const {el,c,ws,sp} of CH){const a=c.t,b=c.end;if(hid||t<a-.05||t>=b){el.style.opacity=0;continue;}
    const o=P(t,b-.25,.25,E.exit);el.style.opacity=1-o;el.style.transform=tf(0,-M.rise*.6*o);
    ws.forEach((w,i)=>{const k=P(t,w.t,M.quick,E.enter);const act=t>=w.t&&(i===ws.length-1||t<ws[i+1].t);const pop=act?1+.03*(1-P(t,w.t,M.quick)):1;
      css(sp[i],{opacity:k,transform:tf(0,M.rise*(1-k),lerp(.98,1,k)*pop),color:act?'#F2C46B':'#FFFFFF'});});}}
function renderDOM(t){const hk=P(t,.2,M.std)*(1-P(t,DUR-.8,M.quick));$('#header').style.opacity=hk;$('#progress').style.opacity=hk*.9;$('#progress i').style.transform=`scaleX(${clamp(t/DUR)})`;}
const NOTES=[
 ['A · Départ du cycle','REVEAL : tension 95 % → apparition → réaction (lueur, poussière) → posé','Réaction : l’archéologue se penche +500 ms','Staging : projecteur sur le pain'],
 ['B · Pas une sculpture','Résolution : tenue sur « carbonisé »','Couleur : rouge qui barre, puis se pose','Entrée 500 ms · montée de 20 px'],
 ['C · Retour en 79','TRANSFORMATION : vibration → métamorphose → vapeur → respiration','Contre-mouvement : le fond passe de la nuit au jour','Fil rouge : le pain'],
 ['D · Ville commerçante','4 actes : le marchand tend (action) → la cliente prend (réaction)','Parallaxe : Vésuve 0,2x · collines 0,5x','Ambiance : un passant à la fois'],
 ['E · La vie quotidienne','3 temps SÉQUENTIELS + pause ≥ 150 ms','Caméra : 1 segment par temps (≤ 1/3)','Chaque temps a sa réaction'],
 ['F · Le sommet','IMPACT : grondement → panache expo → onde → stabilisation lente','Réaction : les têtes se lèvent (+50-150 ms)','Seul emprunt hors Premium'],
 ['G · Accumulation','Niveau de cendre : montée de 2,2 s (lent)','Lapilli : particules « straight ahead »','Ciel : couleur vers le gris'],
 ['H · Fuite','DEPARTURE : rassemblement → sortie (ease-in) → l’espace se referme','Tristesse = lent : ceux qui restent (800 ms)','Un groupe actif à la fois'],
 ['I · Les siècles','CYCLE : soleil et lune (départ → sommet → retour)','Cascade des couches de terrain','Compteur 79 → 1748'],
 ['J · 1748','REVEAL × 3, un par mot','Réaction : lueur sur chaque découverte','Pause après « peints »'],
 ['K · Cavités','REVEAL : silhouette en creux','Réaction : point d’interrogation','Staging : projecteur'],
 ['L · Les moulages','TRANSFORMATION : le plâtre remplit la cavité','REVEAL : la cendre est retirée','Statue barrée → « MOULAGE »'],
 ['M · La vie ordinaire','DEPARTURE : Rome s’efface (98 % → sortie)','Objets : cascade 80 ms × 5 = 400 ms','Le pain revient (fil rouge)'],
 ['N · Le cycle recommence','Même coupe que la scène I (répétition)','Objets modernes : cascade 100 ms','Appel à l’action qui respire'],
];
const ANNOT=new URLSearchParams(location.search).has('annot');
function renderAnnot(t){if(!ANNOT)return;const el=$('#annot');el.style.display='block';
  let i=SCENES.findIndex(s=>t>=s.t0&&t<s.t1);if(i<0)i=SCENES.length-1;const sc=SCENES[i],n=NOTES[i];
  if(el.dataset.i!=String(i)){el.dataset.i=i;el.querySelector('.hd').textContent='SKILL motion-design · '+n[0];el.querySelector('.rs').innerHTML=n.slice(1).map(x=>`<span class="r">${x}</span>`).join('');}
  const k=P(t,sc.t0,M.std,E.enter)*(1-P(t,sc.t1-M.quick,M.quick,E.exit));el.style.opacity=k;el.style.transform=tf(0,M.rise*(1-k));
  [...el.querySelectorAll('.r')].forEach((r,j)=>{const kk=P(t,sc.t0+.15+j*.08,M.std,E.enter);r.style.opacity=kk;r.style.transform=tf(0,M.rise*(1-kk));});}

/* =====================================================================
   11. Compositeur
   ===================================================================== */
let cv,ctx,bufA,bufB;
function drawScene(sc,t,target){const c=target.getContext('2d');c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,1080,1920);const o=sc.draw(c,t)||{};c.restore();
  c.save();dustFX(c,t,o.dust||0,o.dustCol);c.restore();
  if(o.spot){const g=c.createRadialGradient(o.spot.x,o.spot.y,o.spot.r*.45,o.spot.x,o.spot.y,o.spot.r*1.6);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=g;c.fillRect(0,0,1080,1920);}
  return o;}
const XF=.5;
function renderAt(t){
  let i=SCENES.findIndex(s=>t>=s.t0&&t<s.t1);if(i<0)i=SCENES.length-1;const cur=SCENES[i],prev=SCENES[i-1],next=SCENES[i+1];
  ctx.setTransform(1,0,0,1,0,0);let o=drawScene(cur,t,bufA);const dt=t-cur.t0;
  if(prev&&cur.tr==='fade'&&dt<XF){drawScene(prev,t,bufB);ctx.drawImage(bufB,0,0);const k=P(t,cur.t0,XF);ctx.globalAlpha=k;const z=lerp(1.03,1,k);ctx.drawImage(bufA,540-540*z,960-960*z,1080*z,1920*z);ctx.globalAlpha=1;}
  else if(cur.tr==='dip'&&dt<.4){ctx.fillStyle='#000';ctx.fillRect(0,0,1080,1920);ctx.globalAlpha=P(t,cur.t0,.4);ctx.drawImage(bufA,0,0);ctx.globalAlpha=1;}
  else ctx.drawImage(bufA,0,0);
  if(next&&next.tr==='dip'&&next.t0-t<.3){ctx.fillStyle=`rgba(0,0,0,${P(t,next.t0-.3,.3,E.exit)})`;ctx.fillRect(0,0,1080,1920);}
  finishFX(ctx,t,o);
  if(t>DUR-.8){ctx.fillStyle=`rgba(0,0,0,${P(t,DUR-.8,.8)})`;ctx.fillRect(0,0,1080,1920);}
  renderDOM(t);renderCaps(t);renderAnnot(t);
}
async function init(){
  TIMING=await (await fetch('assets/timing.json')).json();
  for(const f of ['700 60px Cormorant','italic 600 60px Cormorant','italic 700 60px Cormorant','800 60px Inter','500 20px Plex'])await document.fonts.load(f);await document.fonts.ready;
  cv=$('#cv');ctx=cv.getContext('2d');
  bufA=document.createElement('canvas');bufA.width=1080;bufA.height=1920;bufB=document.createElement('canvas');bufB.width=1080;bufB.height=1920;
  makeGrain();buildScenes();buildCaps();
  NOCAP=[];
  window.BREATHING=checkBreathing();
  window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))renderAt(parseFloat(q.get('t')));
  else if(q.has('play')){const t0=performance.now();const loop=()=>{renderAt(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);};loop();}
}
init();
